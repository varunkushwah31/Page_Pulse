spring:
  main:
    lazy-initialization: ${SPRING_LAZY_INIT:true}
  application:
    name: web
  jackson:
    deserialization:
      fail-on-unknown-properties: false
      fail-on-null-for-primitives: false
  datasource:
    # Parametrized to allow production cloud databases (like Postgres) while keeping H2 for local dev
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:sitelook_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    generate-unique-name: true
  h2:
    console:
      enabled: ${APP_SECURITY_H2_CONSOLE_ENABLED:true}
      path: /h2-console
  jpa:
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
    hibernate:
      # Allows overriding to 'validate' or 'none' in production to speed up startup
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
    mongodb:
      uri: ${MONGO_URI:mongodb://admin:password@localhost:27017/sitelook_db?authSource=admin}
      database: ${MONGO_DATABASE:sitelook_db}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: ${MANAGEMENT_HEALTH_REDIS_ENABLED:false}
  metrics:
    tags:
      application: ${spring.application.name}
  otlp:
    metrics:
      export:
        enabled: false

otel:
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  exporter:
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
      protocol: http/protobuf
  resource:
    attributes:
      service.name: ${spring.application.name}
      service.version: 1.0.0

resilience4j:
  circuitbreaker:
    instances:
      scraperEngine:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 30s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10
  retry:
    instances:
      scraperEngine:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - java.io.IOException
          - java.net.SocketTimeoutException
          - java.net.UnknownHostException
          - java.net.ConnectException

app:
  jwt:
    secret: ${APP_JWT_SECRET:YnV0dG9ucyBtYWtlIGV2ZXJ5dGhpbmcgc2VjdXJlIGJ5IGV4Y2hhbmdlIG9mIGRhdGEgaW4gdGhlIGFwcGxpY2F0aW9u}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${APP_JWT_REFRESH_EXPIRATION_MS:604800000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175,https://*.vercel.app,https://*.vercel.app/*,*}
    allowed-methods: GET,POST,PUT,DELETE,PATCH,OPTIONS
    max-age: 3600
  security:
    # Reused your existing variable for consistency
    h2-console-enabled: ${APP_SECURITY_H2_CONSOLE_ENABLED:true}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}

server:
  # Changed from SERVER_PORT to PORT to match Render's injected variable
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml,image/svg+xml
    min-response-size: 1024
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.pulse.page.web: ${APP_LOG_LEVEL:INFO}
    org.springframework.web: ${SPRING_WEB_LOG_LEVEL:INFO}
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:INFO}